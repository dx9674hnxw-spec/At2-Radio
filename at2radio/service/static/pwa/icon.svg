     Changer les deux couleurs du dégradé et le tracé du pictogramme (viewBox 0 0 32 32). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <path d="M9 21V11l7-4 7 4v10l-7 4z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
</svg>
