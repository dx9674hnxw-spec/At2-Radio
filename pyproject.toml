[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "at2radio"
version = "0.1.0.dev0"
description = "Bibliothèque pour piloter la radio Baofeng / Alervites AT2 (projet communautaire, non affilié)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.21"]
serial = ["pyserial>=3.5"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
test = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
at2radio-service = "at2radio.service.__main__:main"

[tool.setuptools.packages.find]
include = ["at2radio*"]

[tool.setuptools.package-data]
"at2radio.service" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
